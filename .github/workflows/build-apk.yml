name: Build AdiMusic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AdiMusic repo (workflow + rebrand patch)
        uses: actions/checkout@v4
        with:
          path: adimusic

      - name: Clone upstream LastWave-Native at pinned commit
        run: |
          set -e
          git clone https://github.com/Clash-Projects/LastWave-Native.git source
          cd source
          git checkout b6db40a7257c61636cda9694c0dd2774bcd1cb5c

      - name: Apply AdiMusic rebrand patch
        run: |
          set -e
          cd source
          git apply --check ../adimusic/rebrand.patch
          git apply ../adimusic/rebrand.patch
          echo "--- app_name after patch:"
          grep -m1 'string name="app_name"' app/src/main/res/values/strings.xml

      - name: Apply Listen Together patch
        run: |
          set -e
          cd source
          git apply --check ../adimusic/rebrand-together.patch
          git apply ../adimusic/rebrand-together.patch

      - name: Install AdiMusic launcher icon
        run: |
          base64 -d adimusic/assets/ic_launcher_foreground.png.b64 > source/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          ls -la source/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Create debug keystore for release signing
        run: |
          mkdir -p /home/runner/.config/.android
          keytool -genkeypair -v -keystore /home/runner/.config/.android/debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK
        working-directory: source
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp source/app/build/outputs/apk/release/app-release.apk AdiMusic-v4.2.10.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.2.10-adimusic
          name: "AdiMusic v4.2.10"
          body: "AdiMusic v4.2.10 — Listen Together FIXED! Together tab — room banao ya code se join karo, aur 2 phones par ek hi gaana ek hi time par suno. Dono taraf se control: kisi bhi phone se play/pause/seek/track badlo, doosre par bhi wahi hoga. Connection fix + error dikhata hai agar connect na ho. Pehle purana version uninstall karo, phir install karo. Note: Together ko Supabase keys chahiye (SUPABASE_SETUP.md) — bina keys ke tab setup steps dikhayega."
          files: AdiMusic-v4.2.10.apk

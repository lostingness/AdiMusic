name: Build AdiMusic APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout AdiMusic repo (workflow + rebrand patch)
        uses: actions/checkout@v4
        with:
          path: adimusic

      - name: Clone upstream LastWave-Native at pinned commit
        run: |
          set -e
          git clone https://github.com/Clash-Projects/LastWave-Native.git source
          cd source
          git checkout b6db40a7257c61636cda9694c0dd2774bcd1cb5c

      - name: Apply AdiMusic rebrand patch
        run: |
          set -e
          cd source
          git apply --check ../adimusic/rebrand.patch
          git apply ../adimusic/rebrand.patch
          echo "--- app_name after patch:"
          grep -m1 'string name="app_name"' app/src/main/res/values/strings.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: cp source/app/build/outputs/apk/release/app-release.apk AdiMusic-v4.2.5.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.2.5-adimusic
          name: "AdiMusic v4.2.5"
          body: "AdiMusic v4.2.5 — full AdiMusic rebrand, new app icon, faster release build. Purana version ke upar seedha install ho jayega."
          files: AdiMusic-v4.2.5.apk
